<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InputGlow overlay</title>
<style>
@font-face{font-family:Rajdhani;font-weight:600;src:url(/fonts/Rajdhani-SemiBold.ttf) format("truetype")}
@font-face{font-family:Rajdhani;font-weight:700;src:url(/fonts/Rajdhani-Bold.ttf) format("truetype")}
:root{--lc:#2ec5ff}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent;font-family:Rajdhani,"Segoe UI",system-ui,sans-serif}
body.preview{background:#141c2a}
.lz{width:150px;height:118px;display:block}
.no-laser .lz{display:none}
#ov{position:absolute;transition:opacity .4s}
#ov.bottom-left{left:40px;bottom:40px;transform-origin:bottom left}
#ov.bottom-right{right:40px;bottom:40px;transform-origin:bottom right}
#ov.top-left{left:40px;top:40px;transform-origin:top left}
#ov.top-right{right:40px;top:40px;transform-origin:top right}
.hidden #ov{visibility:hidden}
.pn{display:flex;gap:10px;align-items:flex-end}
.kb{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:4px}
.kw{transition:filter .1s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.k{position:relative;height:28px;min-width:28px;background:rgba(255,255,255,.35);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:transform .08s,background .08s}
.ki{position:absolute;inset:1px;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);background:rgba(12,16,28,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.9);text-transform:uppercase}
.wasd .k{background:var(--lc)}
.wasd .ki{color:var(--lc)}
.kw.on{filter:drop-shadow(0 0 7px var(--lc))}
.kw.on .k{background:var(--lc);transform:translateY(1px) scale(.94)}
.kw.on .ki{background:var(--lc);color:#05070c}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.kps{font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.75);text-align:center;line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.kps b{display:block;font-size:20px;color:var(--lc)}
.ms{width:36px;height:54px;border-radius:18px 18px 14px 14px;border:1.5px solid var(--lc);background:rgba(12,16,28,.6);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:21px 1fr;overflow:hidden}
.mb{border-bottom:1px solid rgba(255,255,255,.25)}
.mb:first-child{border-right:1px solid rgba(255,255,255,.25)}
.mb.on{background:var(--lc)}
</style>
</head>
<body>
<div id="ov" class="bottom-left">
  <div class="pn" id="kbm">
    <div class="kb" id="kb"></div>
    <div class="side">
      <div class="kps">KPS<b id="kps">0</b></div>
      <div class="ms"><div class="mb" id="ml"></div><div class="mb" id="mr"></div></div>
    </div>
    <canvas class="lz" id="lz"></canvas>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).has('preview')) document.body.classList.add('preview');

let S = {color:'#2ec5ff', rgb:false, corner:'bottom-left', size:100, laser:true, sensitivity:0.25, fade:true, fadeSeconds:3};
let hidden = false, lastIn = performance.now(), hue = 0, col = S.color;
const hits = [];
const touch = () => { lastIn = performance.now(); };
const hit = () => { hits.push(performance.now()); touch(); };

/* ---------- keyboard ---------- */
const rows = [[["esc","Esc",34],"1","2","3","4","5"],[["tab","Tab",40],"Q","W","E","R","T"],[["caps","Caps",46],"A","S","D","F","G"],[["shift","Shift",56],"Z","X","C","V","B"],[["ctrl","Ctrl",38],["alt","Alt",34],["space","Space",118]]];
const keys = {};
rows.forEach(r => {
  const d = document.createElement('div'); d.className = 'row';
  r.forEach(k => {
    const [id, lb, wd] = Array.isArray(k) ? k : [k.toLowerCase(), k, 0];
    const w = document.createElement('div');
    w.className = 'kw' + ('wasd'.includes(id) && id.length === 1 ? ' wasd' : '');
    w.innerHTML = '<div class="k"' + (wd ? ' style="min-width:' + wd + 'px"' : '') + '><div class="ki">' + lb + '</div></div>';
    keys[id] = w; d.appendChild(w);
  });
  $('kb').appendChild(d);
});

/* ---------- settings ---------- */
function apply() {
  if (!S.rgb) { col = S.color; document.body.style.setProperty('--lc', col); }
  const ov = $('ov');
  ov.className = S.corner;
  ov.style.transform = 'scale(' + S.size / 100 + ')';
  document.body.classList.toggle('hidden', hidden);
  document.body.classList.toggle('no-laser', !S.laser);
  sizeLaser();
}

/* ---------- laser (lives in an invisible box next to the mouse) ---------- */
const cv = $('lz'), cx = cv.getContext('2d');
const W = 150, H = 118;
let x = W / 2, y = H / 2, trail = [];
function sizeLaser() {
  const p = (devicePixelRatio || 1) * (S.size / 100);  // stay sharp when scaled up
  cv.width = W * p; cv.height = H * p; cx.setTransform(p, 0, 0, p, 0, 0);
}
const rgba = (c, a) => { const n = parseInt(c.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
function hsl2hex(h){const f=n=>{const k=(n+h/30)%12,v=0.5-0.5*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(v*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}

/* ---------- messages from the app ---------- */
function onMsg(m) {
  switch (m.t) {
    case 'hello':
      S = Object.assign(S, m.settings); hidden = m.hidden; apply(); break;
    case 'settings': S = Object.assign(S, m.settings); apply(); break;
    case 'hidden':
      hidden = m.v; document.querySelectorAll('.on').forEach(e => e.classList.remove('on')); apply(); break;
    case 'key': {
      const k = keys[m.k]; if (!k) break;
      if (m.d && !k.classList.contains('on')) hit();
      k.classList.toggle('on', m.d); touch(); break;
    }
    case 'mouse': {
      const el = m.b === 'ml' ? $('ml') : m.b === 'mr' ? $('mr') : null;
      if (m.d) hit();
      if (el) el.classList.toggle('on', m.d); touch(); break;
    }
    case 'move':
      x += m.dx * S.sensitivity * 0.25; y += m.dy * S.sensitivity * 0.25;
      x = Math.max(8, Math.min(W - 8, x)); y = Math.max(8, Math.min(H - 8, y)); touch(); break;
  }
}

function connect() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();

/* ---------- draw loop ---------- */
function loop(t) {
  if (S.rgb) { hue = (hue + 1.2) % 360; col = hsl2hex(hue); document.body.style.setProperty('--lc', col); }
  while (hits.length && t - hits[0] > 1000) hits.shift();
  $('kps').textContent = hits.length;
  $('ov').style.opacity = (S.fade && t - lastIn > S.fadeSeconds * 1000) ? 0.15 : 1;

  x += (W / 2 - x) * 0.06; y += (H / 2 - y) * 0.06;
  trail.push([x, y]); if (trail.length > 34) trail.shift();
  cx.clearRect(0, 0, W, H);
  if (!hidden && S.laser) {  // the box fades and hides with the keyboard
    cx.lineCap = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = i / trail.length;
      cx.strokeStyle = rgba(col, a * a * 0.95); cx.lineWidth = 0.5 + a * 4;
      cx.beginPath(); cx.moveTo(trail[i-1][0], trail[i-1][1]); cx.lineTo(trail[i][0], trail[i][1]); cx.stroke();
    }
    cx.fillStyle = rgba(col, 0.18); cx.beginPath(); cx.arc(x, y, 10, 0, 7); cx.fill();
    cx.strokeStyle = rgba(col, 0.55); cx.lineWidth = 1; cx.beginPath(); cx.arc(x, y, 10, 0, 7); cx.stroke();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(x, y, 2.5, 0, 7); cx.fill();
    cx.strokeStyle = col; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(x, y, 4, 0, 7); cx.stroke();
  }
  requestAnimationFrame(loop);
}
apply();
requestAnimationFrame(loop);
</script>
</body>
</html>
