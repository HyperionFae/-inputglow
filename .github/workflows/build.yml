name: Build InputGlow

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build the exe
        run: python -m PyInstaller --onefile --name InputGlow --add-data "web;web" app.py

      - name: Save the exe
        uses: actions/upload-artifact@v4
        with:
          name: InputGlow
          path: dist/InputGlow.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InputGlow.exe
