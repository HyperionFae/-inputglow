name: Build InputGlow

# Builds InputGlow.exe on GitHub's Windows machines.
# Runs when you push a version tag (like v1.0.0) or press "Run workflow".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Each action is locked to an exact commit (the long code), not a tag that can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked packages
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Build the exe
        run: python -m PyInstaller --onefile --name InputGlow --add-data "web;web" app.py

      - name: Show the exe fingerprint
        shell: pwsh
        run: Get-FileHash dist/InputGlow.exe -Algorithm SHA256 | Format-List

      - name: Save the exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InputGlow
          path: dist/InputGlow.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/InputGlow.exe
